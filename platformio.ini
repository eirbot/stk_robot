; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` sans -e : seulement les firmwares (l'env native n'a pas de main)
default_envs = Motor, Actionneurs
; test/ contient les tests Python : ceux du firmware sont à part
test_dir = firmware_tests

[env:Motor]
platform = espressif32
board = esp32dev
framework = arduino
; Firmware moteurs : tout est dans src/motors (point d'entrée : motors/main.cpp)
build_src_filter = +<motors/>
build_type = release
; C++17 (le cœur Arduino de l'ESP32 compile en C++11 par défaut)
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
lib_ldf_mode = chain+
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	gin66/FastAccelStepper@^1.2.5

[env:Actionneurs]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = 
	+<main_actionneurs.*>
	+<Actionneurs.*>
	+<GpioActionneurs.*>
	+<ComWithRaspActionneurs.*>
lib_deps = 
    https://github.com/xreef/PCF8575_library.git
	https://github.com/RobTillaart/PCF8575.git
    madhephaestus/ESP32Servo @ ^3.0.6
	gin66/FastAccelStepper@^1.2.5

; Tests sur PC du code pur du firmware moteurs (src/motors) : pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter =
	+<motors/kinematics.cpp>
	+<motors/odometry.cpp>
	+<motors/goto_planner.cpp>
	+<motors/protocol.cpp>
	+<motors/motion.cpp>
build_flags = -std=gnu++17 -Wall -Wextra -Isrc