# ==============================================================================
# STKbtw - Hyprland Configuration (Coupe de France de Robotique 2026)
# Kiosk Mode & Dashboard Télémétrie Auto-start
# ==============================================================================

# --- Configuration de l'affichage ---
monitor=,preferred,auto,1

# Curseur logiciel pour éviter la disparition de la souris en VM / sans GPU
cursor {
    no_hardware_cursors = true
}

# Variables d'environnement pour le rendu logiciel en VM si nécessaire
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# --- Démarrage Automatique des Services (exec-once) ---

# 1. Barre de statut et applet réseau en arrière-plan
exec-once = waybar &
exec-once = nm-applet --indicator &

# 2. Lancement du Dashboard (Serveur Web Go + Chromium Kiosk)
exec-once = bash /usr/local/bin/stk-dashboard

# --- Configuration Clavier / Souris ---
input {
    kb_layout = fr
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0
}

# --- Apparence & Rendu ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = false
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}

dwindle {
    preserve_split = true
}

# --- Raccourcis Clavier (Super = Touche Windows) ---
$mainMod = SUPER

# Terminal : 'foot' par défaut (léger, ne crash jamais en VM), 'kitty' en secondaire
$terminal = foot
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, kitty

# Applications & Gestion de fenêtres
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, SPACE, exec, wofi --show drun
bind = $mainMod, F, fullscreen, 0

# Raccourcis Développeur & Robotique
bind = $mainMod, B, exec, $terminal -D /opt/eirbot/Base
bind = $mainMod, D, exec, $terminal -D /home/stk/Base_Data
# Relancer manuellement le Dashboard et le serveur Web
bind = $mainMod, R, exec, bash /usr/local/bin/stk-dashboard

# Navigation des fenêtres
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Souris
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
