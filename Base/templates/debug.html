<!DOCTYPE html>
<html>

<head>
    <title>DEBUG & CONFIG</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/debug.css">

    <script src="/static/js/chart.js"></script>

    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/debug.js" defer></script>
</head>

<body class="mode-BLEUE">
    <div class="header">
        <a href="/" class="btn-back">← Accueil</a>
        <div style="font-weight:bold;">DEBUG & CONFIG</div>
        <div class="sys-info" id="sys-info">...</div>
    </div>

    <div class="debug-grid">

        <div class="card" style="grid-column: span 2;">
            <h3>Consommation (A)</h3>
            <div class="chart-container">
                <canvas id="currentChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>🔌 État Périphériques</h3>
            <div class="dev-status"><span>LiDAR</span>
                <div id="status-lidar" class="status-dot"></div>
            </div>
            <div class="dev-status"><span>ESP Moteurs</span>
                <div id="status-esp_motors" class="status-dot"></div>
            </div>
            <div class="dev-status"><span>ESP Bras</span>
                <div id="status-esp_arms" class="status-dot"></div>
            </div>
            <div class="dev-status"><span>Caméra</span>
                <div id="status-camera" class="status-dot"></div>
            </div>
        </div>

        <div class="card">
            <h3>🧠 Stratégie & Modules</h3>

            <div style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #444;">
                <label>Mode Stratégie :</label>
                <select id="strat-mode" onchange="updateStratConfig()"
                    style="background:#333; color:white; border:1px solid #555; padding:5px; width: 100%; margin-top:5px;">
                    <option value="DYNAMIC">Dynamique (Auto)</option>
                    <option value="STATIC">Statique (Blockly)</option>
                </select>

                <div id="static-strat-box" style="margin-top:10px; display:none;">
                    <label>Fichier Blockly :</label>
                    <select id="strat-select" onchange="updateStratConfig()"
                        style="width:100%; background:#333; color:white; border:1px solid #555; padding:5px;">
                        <option value="" disabled selected>Chargement...</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left;">
                <div style="grid-column: span 2; margin-bottom: 10px;">
                    <label>Mode LiDAR :</label>
                    <select id="lidar-mode" onchange="updateLidarConfig('lidar_mode', this.value)"
                        style="background:#333; color:white; border:1px solid #555; padding:5px; width: 100%; margin-top:5px;">
                        <option value="OFF">Éteint</option>
                        <option value="MATCH">Match (Cône 45°)</option>
                        <option value="HOMOLOGATION">Homologation (360°)</option>
                    </select>
                </div>

                <label><input type="checkbox" id="chk-lidar-simu" onchange="toggleConfig('lidar_simu', this)"> Simu
                    LiDAR</label>

                <label><input type="checkbox" id="chk-ekf" onchange="toggleConfig('ekf_enabled', this)"> EKF
                    (Pos)</label>
                <label><input type="checkbox" id="chk-cam" onchange="toggleConfig('camera.enabled', this)">
                    Caméra</label>

                <label><input type="checkbox" id="chk-avoid" onchange="toggleConfig('avoidance', this)">
                    Évitement</label>
                <label><input type="checkbox" id="chk-skip-homolog" onchange="toggleConfig('skip_homologation', this)">
                    Skip Homolog</label>
            </div>
        </div>

        <div class="card" style="grid-column: span 2;">
            <h3>📝 Logs Système</h3>
            <div id="logs-box" class="log-box">
                <div class="log-line"><span class="log-time">--:--:--</span> <span class="log-info">Interface
                        Prête...</span></div>
            </div>
        </div>

        <div class="card" style="grid-column: span 2;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3>📍 Position Robot (Odométrie)</h3>
                <button onclick="setRobotPosition()" class="btn-tiny"
                    style="background:#4CAF50; padding:8px 15px;">APPLIQUER</button>
            </div>
            <div style="display: flex; gap: 15px; align-items: center; justify-content: center;">
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8em; color:#aaa;">X (mm)</label>
                    <input type="number" id="pos-x" value="200"
                        style="width: 80px; background: #333; color: white; border: 1px solid #555; padding: 5px;">
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8em; color:#aaa;">Y (mm)</label>
                    <input type="number" id="pos-y" value="1200"
                        style="width: 80px; background: #333; color: white; border: 1px solid #555; padding: 5px;">
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.8em; color:#aaa;">θ (Deg)</label>
                    <input type="number" id="pos-theta" value="0"
                        style="width: 80px; background: #333; color: white; border: 1px solid #555; padding: 5px;">
                </div>
            </div>
        </div>

        <div class="card" style="grid-column: span 2;">
            <h3>⚡ Système</h3>
            <div style="margin-bottom:15px; text-align:center;">
                <label style="display:block; margin-bottom:5px;">Luminosité LED : <span id="bright-val">20</span>
                    %</label>
                <input type="range" id="bright-slider" min="0" max="100" step="5" value="20"
                    style="width:80%; accent-color: #E91E63;"
                    oninput="document.getElementById('bright-val').innerText=this.value"
                    onchange="updateBrightness(this.value)">
            </div>
            <div style="display:flex; gap:10px; margin-bottom:15px; justify-content: center;">
                <button id="btn-flash-motors" onclick="flashESP('motors')" class="btn-flash">Flash MOTEURS</button>
                <button id="btn-flash-arms" onclick="flashESP('arms')" class="btn-flash">Flash BRAS</button>
            </div>
            <div style="display:flex; gap:10px; justify-content: center;">
                <a href="/media" class="btn-nav" style="background-color:#673AB7; flex:1;">🎵 SONS</a>
                <a href="/led_studio" class="btn-nav" style="background-color:#E91E63; flex:1;">🎨 LEDS</a>
                <a href="/map" class="btn-nav" style="flex:1;">🗺️ CARTE</a>
            </div>
        </div>

    </div>
</body>

</html>
