<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EIRBOT Replay</title>
    <script src="/static/js/theme.js?v=5"></script>
    <link rel="stylesheet" href="/static/css/common.css?v=6.5">
    <style>
        /* Replay : page plein écran (barre d'outils + carte + graphes) */
        body {
            height: 100vh;
            overflow: hidden;
        }

        .replay-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin: 22px 14px 0;
            padding: 12px 14px;
            font-size: 16px;
        }

        .replay-toolbar .btn {
            margin-bottom: 0;
        }

        .toolbar-sep {
            width: 2px;
            align-self: stretch;
            background: var(--border);
            margin: 0 4px;
        }

        #log-select {
            min-width: 0;
            max-width: 260px;
        }

        #time-slider {
            flex: 1 1 160px;
            min-width: 120px;
        }

        .time-display {
            font-size: 1.1rem;
            min-width: 80px;
            text-align: center;
            color: var(--timer);
            font-weight: 700;
            /* pastille sombre : l'orange du chrono est illisible sur le gris clair de stk */
            background: var(--chip-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 2px 8px;
        }

        .main-content {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 14px;
            padding: 14px;
        }

        .main-content .card {
            margin-bottom: 0;
        }

        .map-container {
            flex: 1;
            min-width: 0;
            position: relative;
            background: var(--chip-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        #map-canvas {
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
        }

        .charts-container {
            width: 400px;
            flex: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-size: 16px;
            text-align: left;
        }

        canvas {
            max-width: 100%;
        }

        .stats-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stats-box .chip {
            justify-content: space-between;
        }

        .stat-batt { color: var(--success); font-weight: 700; }
        .stat-curr { color: var(--orange); font-weight: 700; }

        html[data-theme="win95"] .stat-batt { color: #006400; }
        html[data-theme="win95"] .stat-curr { color: #a04000; }
        html[data-theme="win95"] .time-display {
            background: #000;
            padding: 2px 8px;
            border: 2px solid;
            border-color: var(--w95-sunken-color);
            border-radius: 0;
        }
        html[data-theme="win95"] .map-container { background: #808080 !important; }

        /* Téléphone : tout empilé, la page défile */
        @media (max-width: 800px) {
            body {
                height: auto;
                overflow: visible;
            }

            .replay-toolbar {
                margin: 20px 10px 0;
            }

            .toolbar-sep {
                display: none;
            }

            #log-select {
                flex: 1 1 100%;
                max-width: none;
            }

            .main-content {
                flex-direction: column;
                padding: 12px 10px 10px;
            }

            .charts-container {
                width: auto;
                overflow: visible;
            }
        }
    </style>
    <script src="/static/js/vendor/chart.js"></script>
</head>

<body>
    <header class="header">
        <a href="/" class="btn-back"><svg class="icon"><use href="/static/icons/sprite.svg#i-arrow-left"></use></svg> Accueil</a>
        <h1 class="page-title">REPLAY</h1>
        <span></span>
    </header>

    <div class="toolbar replay-toolbar card">
        <select id="log-select">
            <option>Chargement...</option>
        </select>
        <button class="btn btn-sm btn-primary" onclick="loadLog()"><svg class="icon"><use href="/static/icons/sprite.svg#i-folder-open"></use></svg> CHARGER</button>
        <div class="toolbar-sep"></div>
        <button class="btn btn-sm btn-success" onclick="togglePlay()" id="btn-play"><svg class="icon"><use href="/static/icons/sprite.svg#i-play"></use></svg> PLAY</button>
        <input type="range" id="time-slider" min="0" max="100" value="0" step="1">
        <span class="time-display mono" id="time-display">00.00s</span>
        <select id="speed-select">
            <option value="1">x1</option>
            <option value="2">x2</option>
            <option value="5" selected>x5</option>
            <option value="10">x10</option>
        </select>
    </div>

    <div class="main-content">
        <div class="map-container card">
            <canvas id="map-canvas" width="3000" height="2000"></canvas>
        </div>
        <div class="charts-container card">
            <div class="stats-box">
                <div class="chip"><span class="chip-label">Batterie</span><span id="val-batt" class="stat-batt">--</span></div>
                <div class="chip"><span class="chip-label">Courant</span><span id="val-curr" class="stat-curr">--</span></div>
                <div class="chip"><span class="chip-label">État</span><span id="val-state">--</span></div>
            </div>

            <canvas id="chart-voltage" height="150"></canvas>
            <canvas id="chart-current" height="150"></canvas>
        </div>
    </div>

    <script src="/static/js/replay.js?v=2.1"></script>
</body>

</html>
