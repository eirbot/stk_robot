<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Studio - Robot 2026</title>
    <script src="/static/js/theme.js?v=2"></script>
    <link rel="stylesheet" href="/static/css/common.css?v=5.3">
    <link rel="stylesheet" href="/static/css/led_studio.css?v=2.0">
</head>

<body>
    <div class="studio-container">
        <!-- HEADER STANDARD -->
        <div class="header">
            <a href="/" class="btn-back">⬅ RETOUR</a>
            <div class="page-title">LED STUDIO 🎨</div>
            <div class="sys-info" id="sys-info">...</div>
        </div>

        <!-- BARRE D'OUTILS LED STUDIO -->
        <div class="studio-toolbar">
            <select id="animSelect" class="strat-select">
                <option value="">-- Nouvelle Animation --</option>
            </select>
            <button id="btnNew" class="btn btn-sm btn-primary">⭐ Nouveau</button>
            <div class="toolbar-spacer"></div>
            <button id="btnSave" class="btn btn-sm btn-success">💾 Sauvegarder</button>
            <button id="btnDelete" class="btn btn-sm btn-danger">🗑️ Supprimer</button>
        </div>

        <!-- MAIN CONTENT -->
        <main>
            <!-- LEFT: SEQUENCER -->
            <div class="panel card sequencer">
                <h2 class="card-title">Séquenceur</h2>
                <div class="step-list" id="stepList">
                    <!-- Steps will be generated here -->
                </div>
                <button id="btnAddStep" class="btn btn-sm full-width">+ Ajouter Étape</button>

                <div class="playback-controls">
                    <label class="loop-control check">
                        <input type="checkbox" id="chkLoop"> Boucle (Loop)
                    </label>
                    <div class="row">
                        <button id="btnPlay" class="btn btn-sm btn-primary">▶ Jouer</button>
                        <button id="btnStop" class="btn btn-sm btn-warning">⏹ Stop</button>
                    </div>
                </div>
            </div>

            <!-- CENTER: MATRIX & TOOLS -->
            <div class="panel card matrix-area">
                <div class="toolbar">
                    <div class="color-picker-group">
                        <label>Couleur:</label>
                        <input type="color" id="colorPicker" value="#ff0000">
                    </div>
                    <div class="tool-group">
                        <button class="tool-btn active" data-tool="pen" title="Crayon">✏️</button>
                        <button class="tool-btn" data-tool="fill" title="Remplir tout">🪣</button>
                        <button class="tool-btn" data-tool="eraser" title="Gomme">🧽</button>
                    </div>
                    <div class="step-settings">
                        <label>Durée (s): <input type="number" id="stepDuration" value="1.0" step="0.1"></label>
                        <label>Transition:
                            <select id="stepTransition">
                                <option value="NONE">Aucune (Instant)</option>
                                <option value="FADE">Fondu (Fade)</option>
                            </select>
                        </label>
                    </div>
                </div>

                <div class="matrix-wrapper">
                    <!-- The LED Grid -->
                    <div id="ledMatrix" class="led-matrix"></div>
                </div>

                <div class="matrix-info">
                    <span>288 LEDs (18x16) - Clic & Glisse pour peindre</span>
                </div>
            </div>
        </main>
    </div>

    <!-- SAVE MODAL -->
    <div id="saveModal" class="modal">
        <div class="modal-content card">
            <h3 class="card-title">Sauvegarder l'animation</h3>
            <input type="text" id="animNameInput" placeholder="Nom de l'animation (ex: victory_dance)">
            <div class="modal-actions">
                <button id="btnConfirmSave" class="btn btn-success">Valider</button>
                <button id="btnCancelSave" class="btn btn-ghost">Annuler</button>
            </div>
        </div>
    </div>

    <script src="/static/js/led_studio.js"></script>
</body>

</html>
